services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB__DATABASE:-admirable}
      MYSQL_USER: ${DB__USER:-admirable}
      MYSQL_PASSWORD: ${DB__PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: ../.env
    environment:
      DB__HOST: mysql
      REDIS__URL: redis://redis:6379/0
      APP__ENV: production
      APP__DEBUG: "false"
    volumes:
      - media_data:/app/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: ../.env
    environment:
      DB__HOST: mysql
      REDIS__URL: redis://redis:6379/0
      APP__ENV: production
      APP__DEBUG: "false"
    command: ["taskiq", "worker", "admirable.infrastructure.queue.tasks:broker"]
    volumes:
      - media_data:/app/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - media_data:/app/media:ro
    depends_on:
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  backup:
    image: mysql:8.4
    restart: unless-stopped
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - backups_data:/backups
      - media_data:/media:ro
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB__DATABASE:-admirable}
      DB_USER: ${DB__USER:-admirable}
      DB_PASSWORD: ${DB__PASSWORD}
    entrypoint: ["/bin/bash", "-c", "while true; do /usr/local/bin/backup.sh; sleep 86400; done"]
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  redis_data:
  media_data:
  backups_data:
