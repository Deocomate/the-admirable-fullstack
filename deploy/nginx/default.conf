server {
    listen 80;
    server_name _;

    # Static assets and favicon/robots are served by the FastAPI app itself
    # (StaticFiles mount + dedicated routes) since nginx has no filesystem
    # access to the app image — these fall through to the proxy below.
    # Caching is still applied here via the response's own headers upstream.

    location /media/ {
        alias /app/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
