services:
  web:
    build:
      target: builder
    command: ["uv", "run", "uvicorn", "admirable.presentation.web.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./src:/app/src
      - media_data:/app/media
    ports:
      - "8000:8000"

  worker:
    build:
      target: builder
    command: ["uv", "run", "taskiq", "worker", "admirable.infrastructure.queue.tasks:broker"]
    volumes:
      - ./src:/app/src
      - media_data:/app/media
