[project]
name = "admirable"
version = "0.1.0"
description = "Admirable — FastAPI Clean Architecture"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.52",
    "alembic>=1.13",
    "asyncmy>=0.2.14",
    "cryptography>=43.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.5",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "redis>=5.0",
    "edge-tts>=6.1",
    "bcrypt>=4.2",
    "aiosmtplib>=3.0",
    "itsdangerous>=2.2",
    "aiofiles>=24.1",
    "python-slugify>=8.0",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-aiofiles",
    "beautifulsoup4>=4.12",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admirable"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "admirable.domain.*"
strict = true

[[tool.mypy.overrides]]
module = "admirable.application.*"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: requires real internet access (edge-tts); run explicitly with -m network",
]

[tool.coverage.run]
# Protocol interfaces carry no executable logic — they are contracts
# validated structurally by mypy, not by tests.
omit = ["*/domain/repositories/*"]
